resources:
  jobs:
    job_cinedata_pipeline:
      name: job_cinedata_pipeline
      schedule:
        quartz_cron_expression: 56 30 6 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/gheysonmelo@gmail.com/Rocket/01_Landing_to_Bronze
            source: WORKSPACE
        - task_key: to_Silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/gheysonmelo@gmail.com/Rocket/02_Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/gheysonmelo@gmail.com/Rocket/03_Silver_To_Gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
